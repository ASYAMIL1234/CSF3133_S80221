<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Rock, Paper, Scissors</title>
    <!-- External stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Title and instruction -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name, click Start Game, then pick Rock, Paper or Scissors.</p>
    </header>

    <!-- Name input and start game button -->
    <section id="player">
        <label for="playerName">Name:</label>
        <input type="text" id="playerName" placeholder="Your name">
        <button onclick="startGame()">Start Game</button>
        <p id="welcome"></p>
    </section>

    <!-- Choice buttons and images -->
    <section id="game">
        <button onclick="playRound('rock')">Rock</button>
        <button onclick="playRound('paper')">Paper</button>
        <button onclick="playRound('scissors')">Scissors</button>

        <div class="images">
            <figure>
                <img id="playerImg" alt="Your choice">
                <figcaption>You</figcaption>
            </figure>
            <figure>
                <img id="computerImg" alt="Computer choice">
                <figcaption>Computer</figcaption>
            </figure>
        </div>
    </section>

    <!-- Result message and scoreboard -->
    <section id="resultSection">
        <p id="result"></p>
        <p class="score">
            Wins: <span id="wins">0</span> |
            Losses: <span id="losses">0</span> |
            Draws: <span id="draws">0</span>
        </p>
    </section>

    <!-- Table of every round -->
    <section id="historySection">
        <h2>History</h2>
        <table id="history">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>You</th>
                    <th>Computer</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </section>

    <!-- Summary and reset buttons -->
    <section id="controls">
        <button onclick="showSummary()">Show Summary</button>
        <button onclick="resetGame()">Reset</button>
        <p id="summary"></p>
    </section>

    <!-- Start time and copyright -->
    <footer>
        <p id="startTime"></p>
        <p>&copy; 2026 Computer Science Club</p>
    </footer>

    <!-- External JavaScript -->
    <script src="game.js"></script>
</body>
</html>
